<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MECW · Reader</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Grotesk:wght@500;700&family=Trocchi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="loading" class="loading">
    <div class="spinner" aria-hidden="true"></div>
    <p>Loading the corpus…</p>
    <small>MECW references</small>
  </div>

  <aside class="sidebar">
    <header class="sidebar-head">
      <div class="brand">MECW · Reader</div>

      <div class="dataset-toggle" role="tablist" aria-label="Dataset">
        <button type="button" class="dataset-btn active"
                data-dataset="ireland" role="tab" aria-selected="true">
          Ireland
        </button>
        <button type="button" class="dataset-btn"
                data-dataset="hegel" role="tab" aria-selected="false">
          Hegel
        </button>
      </div>

      <h1 id="dataset-title">Ireland <span>&amp;</span> the Irish Question</h1>
      <p id="stats" class="stats">Loading…</p>
    </header>

    <nav id="tree" class="tree" aria-label="Volume and work tree"></nav>
  </aside>

  <main id="reader" class="reader">
    <div class="reader-placeholder">
      <div class="placeholder-mark">MECW</div>
      <h2>Ireland &amp; the Irish Question</h2>
      <p>Choose a passage from the tree on the left to read it here.</p>
    </div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
